<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OH_CONFIG Local Test Harness</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #0f172a;
        color: #f8fafc;
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px;
        padding: 12px 16px;
        background: #1e293b;
        border-bottom: 1px solid #334155;
      }
      button {
        background: #84cc16;
        color: #0f172a;
        border: none;
        border-radius: 6px;
        padding: 8px 14px;
        font-weight: 700;
        font-size: 14px;
        cursor: pointer;
      }
      button:hover {
        background: #a3e635;
      }
      .log {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 12px;
        color: #cbd5e1;
        flex: 1;
        min-width: 240px;
        white-space: pre-wrap;
        word-break: break-word;
      }
      iframe {
        flex: 1;
        width: 100%;
        border: none;
        background: #ffffff;
      }
    </style>
  </head>
  <body>
    <div class="toolbar">
      <button id="send-both" type="button">Post Sample OH_CONFIG (Flat + Nested)</button>
      <div id="status-log" class="log">Waiting for OH_READY from iframe...</div>
    </div>
    <iframe id="site-frame" src="/?debug=1" title="Site Preview"></iframe>

    <script>
      const frame = document.getElementById('site-frame');
      const btn = document.getElementById('send-both');
      const logEl = document.getElementById('status-log');
      const events = [];

      function appendLog(line) {
        events.push(line);
        logEl.textContent = events.slice(-4).join('\n');
      }

      window.addEventListener('message', (event) => {
        if (event.source !== frame.contentWindow) return;
        const data = event.data;
        if (!data || typeof data !== 'object') return;
        if (data.type === 'OH_READY') {
          appendLog('Received OH_READY v' + data.version);
        } else if (data.type === 'OH_APPLIED') {
          appendLog(
            'Received OH_APPLIED v' +
              data.version +
              ': applied=' +
              (data.applied ? data.applied.length : 0) +
              ', rejected=' +
              JSON.stringify(data.rejected || [])
          );
        }
      });

      const flatConfig = {
        'details.businessName': 'Test Plumbing Ltd',
        'details.logoText': 'Test Plumbing Ltd',
        'details.metaTitle': 'Test Plumbing Ltd | 24/7 Heating & Plumbing',
        'details.metaDescription': 'Reliable emergency plumbing and boiler repairs across the region.',
        'details.hero.title': 'Test Plumbing Ltd - Flat Config',
        'details.hero.subtitle': 'Emergency leaks, boiler servicing and pipework repairs.',
        'details.marquee.items.0': '24/7 Callout',
        'details.marquee.items.1': 'Registered Plumbers',
        'details.marquee.items.2': 'Upfront Quotes',
        'details.faq.items.0.question': 'Do you handle emergency leaks?',
        'details.faq.items.0.answer': 'Yes, rapid response for burst pipes and leaks.',
      };

      const nestedConfig = {
        details: {
          businessName: 'Test Plumbing Ltd',
          logoText: 'Test Plumbing Ltd',
          metaTitle: 'Test Plumbing Ltd | Trusted Plumbers',
          metaDescription: 'Nested config update for Test Plumbing Ltd.',
          hero: {
            title: 'Test Plumbing Ltd - Nested Config',
            subtitle: 'Complete bathroom installations, heating upgrades and maintenance.',
          },
          marquee: {
            items: ['Certified Engineers', 'Fixed Pricing', '5-Year Workmanship Guarantee'],
          },
          services: {
            items: [
              {
                title: 'Emergency Leak Repair',
                text: 'Fast detection and permanent repair for burst or leaking pipes.',
                image: '',
              },
              {
                title: 'Boiler Installation',
                text: 'High-efficiency heating systems installed to manufacturer standards.',
                image: '',
              },
            ],
          },
        },
      };

      btn.addEventListener('click', () => {
        if (!frame.contentWindow) return;
        appendLog('Posting flat OH_CONFIG for Test Plumbing Ltd...');
        frame.contentWindow.postMessage(
          { type: 'OH_CONFIG', version: 1, config: flatConfig },
          '*'
        );

        setTimeout(() => {
          if (!frame.contentWindow) return;
          appendLog('Posting nested OH_CONFIG for Test Plumbing Ltd...');
          frame.contentWindow.postMessage(
            { type: 'OH_CONFIG', version: 1, config: nestedConfig },
            '*'
          );
        }, 800);
      });
    </script>
  </body>
</html>
